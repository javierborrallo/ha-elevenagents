name: Test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  pytest:
    name: "Tests and types, Home Assistant ${{ matrix.release }}"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "minimum"
            requirements: "requirements_test_minimum.txt"
          - release: "newest"
            requirements: "requirements_test.txt"
    permissions:
      contents: read # a private repository has no anonymous clone
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements_common.txt
            ${{ matrix.requirements }}
            requirements_lint.txt

      - name: Install requirements
        run: |
          python3 -m pip install -r requirements_common.txt
          python3 -m pip install -r ${{ matrix.requirements }}
          python3 -m pip install -r requirements_lint.txt

      - name: Tests
        run: python3 -m pytest tests/ -v

      # Home Assistant 2026.10 types its schemas with probatio. The integration
      # imports voluptuous, which 2026.10 aliases to probatio at run time.
      # mypy does not see the alias, so the types run on the minimum only.
      - name: Types
        if: matrix.release == 'minimum'
        run: python3 -m mypy custom_components/ tests/
