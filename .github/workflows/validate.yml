name: Validate

on:
  workflow_dispatch:
  schedule:
    - cron:  "0 0 * * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: Hassfest validation
    runs-on: ubuntu-latest
    permissions:
      contents: read # a private repository has no anonymous clone
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  # Skipped while the repository is private, and re-enabled by itself the
  # moment it becomes public. The action reads file contents through the
  # GitHub API and cannot fetch them from a private repository: six of its
  # eight checks pass, while hacsjson and integration_manifest both report
  # "expected a dictionary. Got None". That failed on every run from
  # 8 September 2026, including on the unmodified scaffold, so a check that
  # can only be red teaches everyone to ignore this workflow.
  hacs: # https://github.com/hacs/action
    name: HACS validation
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # the action reads the repository through the GitHub API
    steps:
      - name: Run HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # the repository is private
        with:
          category: integration
          # Remove this 'ignore' key when you have added brand images for your integration
          # https://developers.home-assistant.io/docs/creating_integration_file_structure#local-brand-images-for-custom-integrations
          ignore: brands
