# Adapted from home-assistant/core and jpawlowski/hacs.integration_blueprint (MIT).
#
# Lint configuration is NOT here: it lives in .ruff.toml, which came with the
# scaffold. Keeping a single source for ruff avoids two configs disagreeing.

[project]
name = "elevenlabs_agent"
version = "0.0.0"              # The real version is managed in manifest.json only
requires-python = ">=3.14"

[tool.setuptools]
packages = ["custom_components.elevenlabs_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "testing_config"]
log_format = "%(asctime)s.%(msecs)03d %(levelname)-8s %(threadName)s %(name)s:%(filename)s:%(lineno)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_debug = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q --strict-markers"
filterwarnings = [
    # Treat warnings as errors to catch issues early
    "error",
    # Home Assistant Core's own use of aiohttp at the version it pins. Raised from
    # homeassistant/helpers/aiohttp_client.py and homeassistant/components/http/,
    # never from this integration, so they would only mask Core's upstream work.
    "ignore:Setting custom ClientSession\\..* attribute is discouraged:DeprecationWarning",
    "ignore:Inheritance class .* from web\\.Application is discouraged:DeprecationWarning",
]

[tool.coverage.run]
source = ["custom_components/elevenlabs_agent"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.mypy]
python_version = "3.14"
# custom_components is a namespace package with no __init__.py, which is
# how Home Assistant loads custom integrations.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
# The integration calls two typed libraries. Checking those call sites is
# the reason this runs at all, so import following stays on.
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Test functions take fixtures whose types come from a plugin.
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# The test helper library ships no py.typed marker.
module = "pytest_homeassistant_custom_component.*"
ignore_missing_imports = true
