# https://www.home-assistant.io/integrations/default_config/
default_config:

# https://www.home-assistant.io/integrations/homeassistant/
homeassistant:
  debug: true

# https://www.home-assistant.io/integrations/logger/
logger:
  default: info
  logs:
    custom_components.elevenagents: debug

# --- Development fixtures ---------------------------------------------------
# The demo integration provides fake lights, switches, climate, covers, locks
# and alarm panels. It requires the numpy package.
# https://www.home-assistant.io/integrations/demo/
demo:

# Additional targets for specific test cases.
input_boolean:
  living_room_lamp:
    name: Living room lamp
    icon: mdi:lamp

input_number:
  living_room_target_temperature:
    name: Living room target temperature
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
