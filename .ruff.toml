# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "CPY001", # copyright notice per file; LICENSE covers it, and neither Home
              # Assistant core nor this scaffold uses per-file headers
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
# Tests assert, take fixtures they do not annotate or use, and compare
# against literals. Home Assistant core exempts its own tests the same way.
"tests/**" = [
    "ANN001",   # missing type annotation for a fixture argument
    "ANN201",   # missing return type on a test function
    "ARG001",   # a fixture is requested for its side effect
    "PLC0415",  # an import inside a test keeps the type local to one case
    "PLR2004",  # a literal in an assertion is the assertion
    "S101",     # assert is how a test states its expectation
]
